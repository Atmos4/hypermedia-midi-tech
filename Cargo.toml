[package]
name = "hypermedia-clients"
version = "0.1.0"
edition = "2021"

# Needs a recent Rust toolchain (iced 0.14 requires 1.88+): rustup update

[dependencies]
iced = { version = "0.14", features = ["tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking"] }
serde = { version = "1", features = ["derive"] }
# preserve_order keeps properties in the order the server sent them
serde_json = { version = "1", features = ["preserve_order"] }

# Desktop clients (iced)
[[bin]]
name = "hardcoded"
path = "clients/bin/hardcoded.rs"
 
[[bin]]
name = "generic"
path = "clients/bin/generic.rs"
